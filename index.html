<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 40px;
      font-size: 2.5em;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
    }
    .game-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }
    .game-button {
      background: #222;
      border: 2px solid #00ffff;
      border-radius: 12px;
      padding: 20px;
      font-size: 1.2em;
      color: #00ffff;
      transition: 0.3s;
      cursor: pointer;
      box-shadow: 0 0 10px #00ffff44;
    }
    .game-button:hover {
      background: #00ffff;
      color: #111;
      box-shadow: 0 0 20px #00ffff;
      transform: translateY(-5px);
    }
  </style>
</head>
<body>
  <h1>🎮 Game Hub</h1>
  <div class="game-container">
    <button class="game-button" onclick="window.location.href='https://example.com/ovo'">OvO</button>
    <button class="game-button" onclick="window.location.href='https://example.com/slope'">Slope</button>
    <button class="game-button" onclick="window.location.href='https://example.com/geometrydash'">Geometry Dash</button>
    <button class="game-button" onclick="window.location.href='https://example.com/minecraft'">Minecraft Classic</button>
    <button class="game-button" onclick="window.location.href='https://example.com/run3'">Run 3</button>
    <button class="game-button" onclick="window.location.href='https://example.com/stickmanhook'">Stickman Hook</button>
    <button class="game-button" onclick="window.location.href='https://example.com/papaspizzeria'">Papa’s Pizzeria</button>
    <button class="game-button" onclick="window.location.href='https://example.com/getawayshootout'">Getaway Shootout</button>
    <button class="game-button" onclick="window.location.href='https://example.com/fireboywatergirl'">Fireboy & Watergirl</button>
    <button class="game-button" onclick="window.location.href='https://example.com/vex7'">Vex 7</button>
  </div>
</body>
</html>
